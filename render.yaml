# One-click deploy on Render: dashboard -> New -> Blueprint -> pick this repo.
# A persistent disk is required for the SQLite database, which needs a paid instance.
services:
  - type: web
    name: multiy-agent
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_URL # set to your https://<name>.onrender.com URL after the first deploy
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
